name: Whale Watching — discover verified active mainnet transfer participants
on:
  workflow_dispatch:
  push:
    paths: [scripts/discover-active.mjs]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/discover-active.mjs
